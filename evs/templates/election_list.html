{% extends 'base.html' %}

{% block title %}Elections{% endblock %}

{% block content %}
    <div class="container mt-5">
        <h1>Elections</h1>
        <ul class="list-group">
            {% for election in elections %}
                <li class="list-group-item">
                    <a href="{% url 'election_detail' election.id %}">{{ election.name }}</a>
                </li>
            {% endfor %}
        </ul>
    </div>
{% endblock %}
